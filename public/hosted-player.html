<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Player Lab HTTPS</title>
<style>
:root{color-scheme:dark}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{display:flex;flex-direction:column;font:12px/1.4 system-ui,sans-serif}
#display-controls{display:flex;flex:0 0 auto;align-items:center;gap:6px;padding:5px 8px;flex-wrap:wrap;background:#151515}
button{border:1px solid #555;border-radius:6px;background:#252525;color:#eee;padding:4px 8px;font:inherit;cursor:pointer}
button:hover:not(:disabled){background:#393939}button:focus-visible{outline:2px solid #8bb9ff;outline-offset:1px}button:disabled{opacity:.45;cursor:default}
#external-link{color:#c9ddff;padding:4px 2px}#external-link[hidden]{display:none}
#display-status{flex:0 0 auto;margin:0;padding:4px 8px;color:#ddd;background:#151515;overflow-wrap:anywhere}
#display-status[hidden]{display:none}iframe{display:block;flex:1 1 0;min-height:0;width:100%;border:0}
</style>
</head>
<body>
<div id="display-controls" role="group" aria-label="독립 플레이어 열기">
<button id="popup-button" type="button" title="영상만 담긴 별도 창이나 탭으로 열기">팝업</button>
<button id="expand-button" type="button" title="독립 플레이어에서 전체화면 시작">팝업 후 전체화면</button>
<a id="external-link" target="_blank" rel="noopener" hidden>직접 열기 ↗</a>
</div>
<p id="display-status" role="status" aria-live="polite" hidden></p>
<iframe id="hosted-player" title="YouTube Player Lab HTTPS" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
<script>
(()=>{
'use strict';
const playerOrigin=new URL('__PLAYER_ORIGIN__').origin;
const frame=document.getElementById('hosted-player');
const popupButton=document.getElementById('popup-button'),expandButton=document.getElementById('expand-button'),externalLink=document.getElementById('external-link');
const status=document.getElementById('display-status'),state=document.documentElement.dataset;
const pending=new Map();
let bridgeReady=false,hostOpenLinks=false,busy=false,nextId=0;
let loaded=false,pendingVideo=null,video='M7lc1UVf-VE',lastFullscreen=false;
function showStatus(text){status.textContent=text;status.hidden=!text}
function renderControls(){
  popupButton.disabled=busy;expandButton.disabled=busy;
  state.externalBridge=bridgeReady&&hostOpenLinks?'mcp':typeof window.openai?.openExternal==='function'?'openai':window.parent===window?'browser':'link';
  state.hostOpenLinks=String(hostOpenLinks);
}
function destination(fullscreen){
  const url=new URL('/popout',playerOrigin);url.searchParams.set('videoId',video);
  if(fullscreen)url.searchParams.set('fullscreen','1');
  return url.href;
}
function fallback(href,text){
  externalLink.href=href;externalLink.target='_blank';externalLink.rel='noopener';externalLink.hidden=false;showStatus(text);
}
function request(method,params){
  return new Promise((resolve,reject)=>{
    const id='youtube-ui-'+(++nextId);
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'))},8000);
    pending.set(id,{resolve,reject,timer});
    window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
function bounded(promise){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('timeout')),8000);
    Promise.resolve(promise).then(value=>{clearTimeout(timer);resolve(value)},error=>{clearTimeout(timer);reject(error)});
  });
}
async function openPlayer(fullscreen){
  if(busy)return;
  lastFullscreen=fullscreen;
  const href=destination(fullscreen);externalLink.href=href;externalLink.hidden=true;
  busy=true;renderControls();showStatus('독립 플레이어 열기를 요청하는 중…');
  try{
    let result;
    if(bridgeReady&&hostOpenLinks)result=await request('ui/open-link',{url:href});
    else if(typeof window.openai?.openExternal==='function')result=await bounded(window.openai.openExternal({href,redirectUrl:false}));
    else if(window.parent===window&&typeof window.open==='function')window.open(href,'_blank','popup=yes,width=960,height=600,noopener');
    else throw new Error('unavailable');
    if(result?.isError)throw new Error('host-error');
    state.navigationState='requested';
    fallback(href,'새 창이 열리지 않으면 직접 열기를 눌러 주세요.');
  }catch{
    state.navigationState='unconfirmed';
    fallback(href,'창 열기 요청을 확인하지 못했어요. 직접 열기를 눌러 주세요.');
  }finally{busy=false;renderControls()}
}
popupButton.addEventListener('click',()=>openPlayer(false));
expandButton.addEventListener('click',()=>openPlayer(true));
window.addEventListener('openai:set_globals',renderControls);
function forward(videoId){
  frame.contentWindow.postMessage({method:'ui/notifications/tool-result',params:{structuredContent:{videoId}}},playerOrigin);
}
window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;
  const message=event.data;
  if(message?.jsonrpc==='2.0'&&message.method==='ping'&&message.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');return}
  if(message?.jsonrpc==='2.0'&&!message.method&&pending.has(message.id)){
    const item=pending.get(message.id);pending.delete(message.id);clearTimeout(item.timer);
    if(message.error)item.reject(new Error('host-error'));else item.resolve(message.result);
    return;
  }
  if(message?.method!=='ui/notifications/tool-result')return;
  const videoId=message.params?.structuredContent?.videoId;
  if(typeof videoId!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;
  video=videoId;state.videoId=videoId;externalLink.href=destination(lastFullscreen);
  if(loaded)forward(videoId);else pendingVideo=videoId;
});
frame.addEventListener('load',()=>{
  loaded=true;
  if(pendingVideo!==null){const videoId=pendingVideo;pendingVideo=null;forward(videoId)}
});
frame.referrerPolicy='strict-origin-when-cross-origin';
frame.src=playerOrigin+'/player';
externalLink.href=destination(false);externalLink.target='_blank';externalLink.rel='noopener';renderControls();
if(typeof window.parent.postMessage==='function'&&window.parent!==window){
  request('ui/initialize',{appInfo:{name:'youtube-player-lab',version:'0.1.5'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'}).then(result=>{
    if(!result||typeof result.protocolVersion!=='string'||!result.hostCapabilities)throw new Error('initialize');
    bridgeReady=true;hostOpenLinks=Boolean(result.hostCapabilities.openLinks);renderControls();
    window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');
  }).catch(()=>{renderControls()});
}
})();
</script>
</body>
</html>
