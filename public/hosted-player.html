<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Player Lab HTTPS</title>
<style>
:root{color-scheme:dark}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{display:flex;flex-direction:column;font:12px/1.4 system-ui,sans-serif}
#display-controls{display:flex;flex:0 0 auto;align-items:center;gap:6px;padding:5px 8px;flex-wrap:wrap;background:#151515}
button{border:1px solid #555;border-radius:6px;background:#252525;color:#eee;padding:4px 8px;font:inherit;cursor:pointer}
button:hover:not(:disabled){background:#393939}button:focus-visible{outline:2px solid #8bb9ff;outline-offset:1px}button:disabled{opacity:.45;cursor:default}
#display-status{flex:0 0 auto;margin:0;padding:4px 8px;color:#ddd;background:#151515;overflow-wrap:anywhere}
#display-status[hidden]{display:none}iframe{display:block;flex:1 1 0;min-height:0;width:100%;border:0}
</style>
</head>
<body>
<div id="display-controls" role="group" aria-label="플레이어 표시 모드">
<button id="popup-button" type="button" disabled>팝업</button>
<button id="expand-button" type="button" disabled>팝업 후 전체화면</button>
<button id="inline-button" type="button" disabled>채팅으로</button>
</div>
<p id="display-status" role="status" aria-live="polite" hidden></p>
<iframe id="hosted-player" title="YouTube Player Lab HTTPS" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
<script>
(()=>{
'use strict';
const playerOrigin=new URL('__PLAYER_ORIGIN__').origin;
const frame=document.getElementById('hosted-player');
const popupButton=document.getElementById('popup-button'),expandButton=document.getElementById('expand-button'),inlineButton=document.getElementById('inline-button');
const status=document.getElementById('display-status'),state=document.documentElement.dataset;
const modes=['inline','pip','fullscreen'],pending=new Map();
let bridgeReady=false,availableModes=null,displayMode=null,busy=false,nextId=0;
let loaded=false,pendingVideo=null;
function showStatus(text){status.textContent=text;status.hidden=!text}
function renderControls(){
  const connected=bridgeReady||typeof window.openai?.requestDisplayMode==='function';
  state.displayBridge=bridgeReady?'mcp':connected?'openai':'unavailable';
  popupButton.disabled=busy||!connected||(availableModes!==null&&!availableModes.includes('pip'));
  expandButton.disabled=popupButton.disabled||(availableModes!==null&&!availableModes.includes('fullscreen'));
  inlineButton.disabled=busy||!connected||(availableModes!==null&&!availableModes.includes('inline'));
}
function updateContext(context){
  if(modes.includes(context?.displayMode)){displayMode=context.displayMode;state.displayMode=displayMode}
  if(Array.isArray(context?.availableDisplayModes))availableModes=context.availableDisplayModes.filter(mode=>modes.includes(mode));
  renderControls();
}
function request(method,params){
  return new Promise((resolve,reject)=>{
    const id='youtube-ui-'+(++nextId);
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'))},8000);
    pending.set(id,{resolve,reject,timer});
    window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
function bounded(promise){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('timeout')),8000);
    Promise.resolve(promise).then(value=>{clearTimeout(timer);resolve(value)},error=>{clearTimeout(timer);reject(error)});
  });
}
async function changeMode(mode){
  const result=bridgeReady?await request('ui/request-display-mode',{mode}):await bounded(window.openai.requestDisplayMode({mode}));
  const actual=modes.includes(result?.mode)?result.mode:window.openai?.displayMode;
  if(!modes.includes(actual))throw new Error('unconfirmed');
  updateContext({displayMode:actual});
  if(actual!==mode)throw new Error('not-granted');
}
async function present(mode){
  if(busy)return;
  busy=true;renderControls();
  showStatus(mode==='fullscreen'?'고정 팝업을 거쳐 전체화면으로 전환 중…':mode==='pip'?'고정 팝업으로 전환 중…':'채팅 화면으로 돌아가는 중…');
  try{
    if(mode==='fullscreen'&&displayMode!=='pip')await changeMode('pip');
    await changeMode(mode);
    showStatus('');
  }catch{
    showStatus(mode==='fullscreen'?'전체화면 전환을 확인하지 못했어요. 팝업이 열렸다면 그 창에서 다시 눌러 주세요.':mode==='pip'?'고정 팝업 전환을 확인하지 못했어요. 이 앱에서 지원하지 않거나 요청이 거절됐을 수 있어요.':'채팅 화면으로 돌아가지 못했어요. 다시 눌러 주세요.');
  }finally{busy=false;renderControls()}
}
popupButton.addEventListener('click',()=>present('pip'));
expandButton.addEventListener('click',()=>present('fullscreen'));
inlineButton.addEventListener('click',()=>present('inline'));
window.addEventListener('openai:set_globals',event=>{updateContext(event.detail?.globals);if(!busy)showStatus('')});
function forward(videoId){
  frame.contentWindow.postMessage({method:'ui/notifications/tool-result',params:{structuredContent:{videoId}}},playerOrigin);
}
window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;
  const message=event.data;
  if(message?.jsonrpc==='2.0'&&message.method==='ping'&&message.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');return}
  if(message?.jsonrpc==='2.0'&&!message.method&&pending.has(message.id)){
    const item=pending.get(message.id);pending.delete(message.id);clearTimeout(item.timer);
    if(message.error)item.reject(new Error('host-error'));else item.resolve(message.result);
    return;
  }
  if(message?.method==='ui/notifications/host-context-changed'){updateContext(message.params);return}
  if(message?.method!=='ui/notifications/tool-result')return;
  const videoId=message.params?.structuredContent?.videoId;
  if(typeof videoId!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;
  if(loaded)forward(videoId);else pendingVideo=videoId;
});
frame.addEventListener('load',()=>{
  loaded=true;
  if(pendingVideo!==null){const videoId=pendingVideo;pendingVideo=null;forward(videoId)}
});
frame.referrerPolicy='strict-origin-when-cross-origin';
frame.src=playerOrigin+'/player';
updateContext({displayMode:window.openai?.displayMode});
if(typeof window.parent.postMessage==='function'&&window.parent!==window){
  request('ui/initialize',{appInfo:{name:'youtube-player-lab',version:'0.1.3'},appCapabilities:{availableDisplayModes:modes},protocolVersion:'2026-01-26'}).then(result=>{
    if(!result||typeof result.protocolVersion!=='string'||!result.hostCapabilities)throw new Error('initialize');
    bridgeReady=true;updateContext(result.hostContext);
    window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');
    if(availableModes!==null&&!availableModes.includes('pip'))showStatus('이 앱은 고정 팝업 모드를 제공하지 않아요.');
  }).catch(()=>{renderControls();if(state.displayBridge==='unavailable')showStatus('이 환경에서는 ChatGPT 고정 팝업을 사용할 수 없어요.')});
}else if(state.displayBridge==='unavailable')showStatus('ChatGPT 안에서 팝업 버튼을 사용할 수 있어요.');
})();
</script>
</body>
</html>
