<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Player Lab HTTPS</title>
<style>html,body{margin:0;background:#10141c}iframe{display:block;width:100%;height:900px;min-height:600px;border:0}</style>
</head>
<body>
<iframe id="hosted-player" title="YouTube Player Lab HTTPS" allow="autoplay; fullscreen; picture-in-picture"></iframe>
<script>
(()=>{
'use strict';
const playerOrigin=new URL('__PLAYER_ORIGIN__').origin;
const frame=document.getElementById('hosted-player');
let loaded=false,pendingVideo=null;
function forward(videoId){
  frame.contentWindow.postMessage({method:'ui/notifications/tool-result',params:{structuredContent:{videoId}}},playerOrigin);
}
window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;
  const message=event.data;
  if(message?.method!=='ui/notifications/tool-result')return;
  const videoId=message.params?.structuredContent?.videoId;
  if(typeof videoId!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;
  if(loaded)forward(videoId);else pendingVideo=videoId;
});
frame.addEventListener('load',()=>{
  loaded=true;
  if(pendingVideo!==null){const videoId=pendingVideo;pendingVideo=null;forward(videoId)}
});
frame.referrerPolicy='strict-origin-when-cross-origin';
frame.src=playerOrigin+'/player';
})();
</script>
</body>
</html>
